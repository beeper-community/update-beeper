name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Verify version consistency
        run: |
          SCRIPT_VERSION=$(grep -oP 'SCRIPT_VERSION="\K[0-9]+\.[0-9]+\.[0-9]+' update-beeper || echo "not found")
          TAG_VERSION="${{ steps.version.outputs.version }}"

          echo "SCRIPT_VERSION in update-beeper: $SCRIPT_VERSION"
          echo "Tag version: $TAG_VERSION"

          if [[ "$SCRIPT_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch! SCRIPT_VERSION ($SCRIPT_VERSION) != tag ($TAG_VERSION)"
            echo "Please update SCRIPT_VERSION in update-beeper before tagging."
            exit 1
          fi
          echo "✓ Versions match"

      - name: Generate changelog excerpt
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.version.outputs.version }}"

          # Try to extract section between this version and the next
          CHANGELOG=$(awk "/^## \[?$VERSION\]?/,/^## \[?[0-9]/" CHANGELOG.md 2>/dev/null | head -n -1 || echo "")

          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="See [CHANGELOG.md](./CHANGELOG.md) for details."
          fi

          # Write to file for multiline support
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "Generated changelog excerpt"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "update-beeper ${{ steps.version.outputs.tag }}"
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
