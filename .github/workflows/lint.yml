name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          # Include scripts without .sh extension
          additional_files: 'update-beeper beeper-version beeper-health jarvis-beeper'
        env:
          SHELLCHECK_OPTS: -e SC2034 -e SC1091

  syntax-check:
    name: Bash Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          # All executable shell scripts in the repo
          scripts=(
            "update-beeper"
            "beeper-version"
            "beeper-health"
            "jarvis-beeper"
            "install.sh"
          )
          for script in "${scripts[@]}"; do
            if [[ -f "$script" ]]; then
              echo "Checking $script..."
              bash -n "$script"
            fi
          done
          echo "✓ All scripts have valid syntax"
